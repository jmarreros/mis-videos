# jmarreros.com — landing en la raíz + una app por subcarpeta.
# Cada app vive en /var/www/jmarreros.com/<app>/ y trae su propio bloque en
# /etc/nginx/jmarreros.com/apps/<app>.conf (se incluyen todos abajo).
# Ver /var/www/jmarreros.com/LEEME.md
server {
    listen 80;
    listen [::]:80;
    server_name jmarreros.com www.jmarreros.com;

    root /var/www/jmarreros.com/landing;
    index index.html index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Landing (estática). Si algún día es PHP/Laravel, cambiar por try_files ... /index.php
    location / {
        try_files $uri $uri/ =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ /\.(?!well-known).* { deny all; }

    # Apps en subcarpetas (jmarreros.com/<app>/)
    include /etc/nginx/jmarreros.com/apps/*.conf;
}
