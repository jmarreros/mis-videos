# jmarreros.com/mis-videos/ → Laravel en /var/www/jmarreros.com/mis-videos
# Plantilla para otra app Laravel: copiar, y reemplazar "mis-videos" por el nombre de la carpeta.

location = /mis-videos { return 301 /mis-videos/; }

# Assets de Vite (nombres con hash): caché larga
location ^~ /mis-videos/build/ {
    alias /var/www/jmarreros.com/mis-videos/public/build/;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable";
}

# Manifest de la PWA con su tipo MIME correcto
location = /mis-videos/manifest.webmanifest {
    alias /var/www/jmarreros.com/mis-videos/public/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
}

location ^~ /mis-videos/ {
    alias /var/www/jmarreros.com/mis-videos/public/;
    client_max_body_size 20M;

    # Archivo real de public/ → se sirve; lo demás → Laravel
    try_files $uri @mis-videos;

    # Nunca entregar un .php como texto: todo .php va a Laravel
    location ~ \.php$ { try_files /__no_existe__ @mis-videos; }
    location ~ /\.(?!well-known).* { deny all; }
}

location @mis-videos {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    # SCRIPT_NAME=/mis-videos/index.php hace que Laravel detecte /mis-videos como base de las URLs
    fastcgi_param SCRIPT_FILENAME /var/www/jmarreros.com/mis-videos/public/index.php;
    fastcgi_param SCRIPT_NAME     /mis-videos/index.php;
    fastcgi_param DOCUMENT_ROOT   /var/www/jmarreros.com/mis-videos/public;
    fastcgi_hide_header X-Powered-By;
}
